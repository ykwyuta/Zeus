name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  ccvs85:
    # Runs the NIST CCVS85 suite with GnuCOBOL (comparison baseline) and with
    # zcobc, and publishes both side by side in the job summary. The job
    # fails only when the harness itself fails, not on test failures.
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GnuCOBOL (comparison oracle)
        run: sudo apt-get update && sudo apt-get install -y gnucobol3
      - uses: actions/cache@v4
        with:
          path: .cache/ccvs85
          key: ccvs85-${{ hashFiles('tools/fetch-ccvs85.sh') }}
      - run: tools/fetch-ccvs85.sh
      - run: cargo build --release
      - name: Extract suite (verified against EXEC85 reference)
        run: >
          target/release/zeus-ccvs extract --newcob .cache/ccvs85/newcob.val
          --out work/suite --verify ccvs85/extract-manifest.txt
      - name: Run with GnuCOBOL
        run: target/release/zeus-ccvs run --suite work/suite --toolchain gnucobol --out work/gnucobol.json > /dev/null
      - name: Extract suite for zcobc (EBCDIC native collating sequence)
        run: >
          target/release/zeus-ccvs extract --newcob .cache/ccvs85/newcob.val
          --overlay ccvs85/exec85-zeus.conf --out work/suite-zeus
      - name: Run with zcobc
        run: target/release/zeus-ccvs run --suite work/suite-zeus --toolchain zeus --out work/zeus.json > /dev/null
      - name: Summary
        run: >
          target/release/zeus-ccvs report --results work/zeus.json
          --baseline work/gnucobol.json --programs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ccvs85-results
          path: work/*.json

  carddemo:
    # Sets up AWS CardDemo (fetched at a pinned commit) on Zeus, runs its
    # batch jobs through zjob (fails unless every job ends with RC 0), then
    # its online transactions through zcics with the scripts in
    # tools/carddemo-online.
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .cache/carddemo
          key: carddemo-${{ hashFiles('tools/fetch-carddemo.sh') }}
      - run: tools/carddemo.sh all
      - run: tools/carddemo-online.sh test
      - name: Install s3270 and pr3287 (3270 display and printer emulators)
        run: sudo apt-get update && sudo apt-get install -y s3270 pr3287
      - run: tools/carddemo-online.sh tn3270
      - run: tools/tn3270-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carddemo-spool
          path: work/carddemo/spool

  bankofz-ims:
    # Bank of Z on IMS: its databases loaded by its load programs, and its
    # transactions (COBOL and the PL/I IBLOGIN) run as messages through a
    # message processing region.
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .cache/bankofz
          key: bankofz-${{ hashFiles('tools/fetch-bankofz.sh') }}
      - run: tools/bankofz-ims.sh test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bankofz-ims-spool
          path: work/bankofz-ims/spool

  db2:
    # Db2 Community Edition in a container (downloaded from IBM's registry):
    # the DRDA client and EXEC SQL tests, CardDemo's Db2 module (table
    # creation, MNTTRDB2 batch, transaction type screens) and GenApp
    # (customer and policy transactions on Db2 and VSAM) and Bank of Z
    # (the CICS path: customers and accounts on Db2).
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .cache/carddemo
          key: carddemo-${{ hashFiles('tools/fetch-carddemo.sh') }}
      - name: Start Db2 CE
        run: echo "ZEUS_DB2=$(tools/db2ce.sh start)" >> "$GITHUB_ENV"
      - run: cargo test -p zeus-drda -p zeus-db2
      - run: tools/carddemo.sh setup
      - run: tools/carddemo-db2.sh test
      - uses: actions/cache@v4
        with:
          path: .cache/genapp
          key: genapp-${{ hashFiles('tools/fetch-genapp.sh') }}
      - run: tools/genapp.sh test
      - name: Install s3270 (3270 emulator for the TN3270 test)
        run: sudo apt-get update && sudo apt-get install -y s3270
      - run: tools/genapp.sh tn3270
      - uses: actions/cache@v4
        with:
          path: .cache/bankofz
          key: bankofz-${{ hashFiles('tools/fetch-bankofz.sh') }}
      - run: tools/bankofz.sh test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db2-spool
          path: |
            work/carddemo/spool
            work/genapp/spool
            work/bankofz/spool

  codepages:
    # The code page tables are those ICU's mapping files give.
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: tools/icu-codepages.sh
      - name: Tables are up to date
        run: git diff --exit-code crates/zeus-cobol/codepages

  apps-inventory:
    # Compiles every COBOL program of CardDemo, GenApp and Bank of Z and
    # checks that docs/inventory/apps.md matches the result.
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .cache
          key: apps-${{ hashFiles('tools/fetch-carddemo.sh', 'tools/fetch-genapp.sh', 'tools/fetch-bankofz.sh') }}
      - run: tools/apps-inventory.sh
      - name: Inventory is up to date
        run: git diff --exit-code docs/inventory/apps.md

  hercules-oracle:
    # Records Hercules results for packed-decimal instructions (oracle for
    # zeus-decimal), checks the pipeline against known results and compares
    # zeus-decimal with Hercules on fresh random cases.
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Hercules (comparison oracle)
        run: sudo apt-get update && sudo apt-get install -y hercules
      - run: cargo test -p zeus-hercdiff
      - run: cargo run --release -p zeus-hercdiff -- run --count 1000 --seed ${{ github.run_number }} --run-seconds 3 --out work/decimal-oracle.json --compare
      - uses: actions/upload-artifact@v4
        with:
          name: decimal-oracle
          path: work/decimal-oracle.json
