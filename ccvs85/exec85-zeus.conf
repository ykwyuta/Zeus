* X-card values specific to Zeus, applied over exec85.conf with
*   zeus-ccvs extract --overlay ccvs85/exec85-zeus.conf
*
* X-63/X-64: the native collating sequence of the characters used by the
* SORT/MERGE tests, ascending and descending. Zeus keeps data in EBCDIC
* (code page 037), so the native order is the EBCDIC one, not ASCII.
X-06373 " .<(+$$*);-/,>=ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
X-06473 "9876543210ZYXWVUTSRQPONMLKJIHGFEDCBA=>,/-;)*$$+(<. "
*END-MONITOR
