[package]
name = "zeus-cics"
description = "Zeus CICS: transactions, program control, file control, queues and BMS on a 3270 screen model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
corosensei = "0.3"
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
roxmltree = "0.20"
zeus-bms = { path = "../zeus-bms" }
zeus-cobol = { path = "../zeus-cobol" }
zeus-db2 = { path = "../zeus-db2" }
zeus-mq = { path = "../zeus-mq" }
zeus-ims = { path = "../zeus-ims" }
zeus-decimal = { path = "../zeus-decimal" }
zeus-ds = { path = "../zeus-ds" }
zeus-jcl = { path = "../zeus-jcl" }
zeus-pli = { path = "../zeus-pli" }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "zcics"
path = "src/main.rs"

# The dispatcher's coroutines need unsafe code; everything else denies it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
