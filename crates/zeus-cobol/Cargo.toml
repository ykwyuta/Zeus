[package]
name = "zeus-cobol"
description = "Zeus COBOL compiler (Enterprise COBOL 4.2 dialect) and ZIR interpreter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zeus-decimal = { path = "../zeus-decimal", features = ["serde"] }
zeus-ds = { path = "../zeus-ds" }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
cranelift-codegen = { version = "0.127.4", default-features = false, features = ["std", "x86", "arm64", "unwind"] }
cranelift-frontend = "0.127.4"
tempfile.workspace = true

[[bin]]
name = "zcobc"
path = "src/main.rs"

[lints]
workspace = true

[[bin]]
name = "zcov"
path = "src/bin/zcov.rs"

[[bin]]
name = "zas"
path = "src/bin/zas.rs"
