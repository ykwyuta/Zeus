[package]
name = "zeus-mq"
description = "Zeus MQ: the MQI calls of COBOL programs on IBM MQ through the IBM MQ C client library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zeus-cobol = { path = "../zeus-cobol" }
libloading = "0.8"

# The FFI module needs unsafe code; everything else denies it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bin]]
name = "zmq"
path = "src/zmq.rs"
