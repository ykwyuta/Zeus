[package]
name = "zeus-native"
description = "Zeus run time of native executables (zcobc / zpli --native)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
memmap2 = "0.9.11"
wasmtime-jit-icache-coherence = "34.0.2"
zeus-cobol = { path = "../zeus-cobol" }
zeus-db2 = { path = "../zeus-db2" }
zeus-ds = { path = "../zeus-ds" }
zeus-mq = { path = "../zeus-mq" }
zeus-pli = { path = "../zeus-pli" }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "zeus-rt"
path = "src/main.rs"

# the loader of machine code (src/machine_code.rs) needs unsafe code
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
